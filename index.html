<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#111827">

<title>SmallRoute v0.3</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

html,
body,
#map {
  height: 100%;
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  background: #111827;
  color: #111827;
}

#map {
  position: fixed;
  inset: 0;
}

/* TOP PANEL */

.panel {
  position: fixed;
  z-index: 1000;
  left: 12px;
  right: 12px;
  top: 12px;

  background: #ffffff;
  border-radius: 18px;

  box-shadow: 0 5px 25px #0003;

  padding: 10px;
}

/* SEARCH */

.search {
  display: flex;
  gap: 8px;
}

.search input {
  flex: 1;

  border: 0;
  background: #f1f5f9;

  border-radius: 12px;

  padding: 13px;

  font-size: 16px;

  outline: none;
}

.search button,
.primary {
  border: 0;

  border-radius: 12px;

  padding: 0 14px;

  font-weight: 700;

  background: #111827;
  color: #ffffff;
}

/* VEHICLE BUTTONS */

.chips {
  display: flex;
  gap: 7px;

  overflow-x: auto;

  padding: 9px 0 2px;
}

.chip {
  white-space: nowrap;

  border: 1px solid #d1d5db;

  background: #ffffff;

  border-radius: 999px;

  padding: 8px 11px;

  font-weight: 650;
}

.chip.active {
  background: #111827;
  color: #ffffff;

  border-color: #111827;
}

/* SETTINGS */

.settings {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 9px;
}

.setting {
  background: #f8fafc;

  border-radius: 11px;

  padding: 8px;

  font-size: 12px;

  display: flex;

  align-items: center;

  gap: 7px;
}

.setting input {
  accent-color: #111827;
}

/* STATUS */

.status {
  margin-top: 8px;

  font-size: 12px;

  color: #475569;

  display: flex;

  justify-content: space-between;

  gap: 10px;
}

.status b {
  color: #111827;
}

/* BOTTOM NAVIGATION CARD */

.bottom {
  position: fixed;

  z-index: 1000;

  left: 12px;
  right: 12px;

  bottom: 12px;

  background: #ffffff;

  border-radius: 18px;

  box-shadow: 0 5px 25px #0003;

  padding: 12px;
}

.routeLine {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;
}

.routeTitle {
  font-size: 15px;

  font-weight: 800;
}

.routeMeta {
  font-size: 12px;

  color: #64748b;

  margin-top: 3px;
}

.primary {
  padding: 12px 16px;
}

/* ACTION BUTTONS */

.actions {
  display: flex;

  gap: 8px;

  margin-top: 9px;
}

.actions button {
  flex: 1;

  border: 0;

  border-radius: 11px;

  padding: 10px;

  font-weight: 750;
}

.report {
  background: #fee2e2;

  color: #991b1b;
}

.locate {
  background: #e2e8f0;
}

/* NOTICE */

.notice {
  font-size: 11px;

  color: #64748b;

  margin-top: 8px;

  line-height: 1.35;
}

/* TOAST */

#toast {
  position: fixed;

  z-index: 2000;

  left: 50%;

  bottom: 150px;

  transform: translateX(-50%);

  background: #111827;

  color: #ffffff;

  padding: 10px 14px;

  border-radius: 999px;

  font-size: 13px;

  display: none;

  max-width: 90%;

  text-align: center;
}

.leaflet-control-attribution {
  font-size: 9px;
}
</style>
</head>

<body>

<div id="map"></div>


<!-- TOP PANEL -->

<div class="panel">

  <div class="search">

    <input
      id="dest"
      placeholder="Where to?"
      autocomplete="off">

    <button id="searchBtn">
      Go
    </button>

  </div>


  <!-- VEHICLE SELECTION -->

  <div class="chips">

    <button
      class="chip active"
      data-v="50">
      50cc
    </button>

    <button
      class="chip"
      data-v="150">
      150cc
    </button>

    <button
      class="chip"
      data-v="moto">
      Motorcycle
    </button>

    <button
      class="chip"
      data-v="bicycle">
      Motorized bicycle
    </button>

  </div>


  <!-- ROUTING OPTIONS -->

  <div class="settings">

    <label class="setting">
      <input
        id="highways"
        type="checkbox"
        checked>
      Avoid highways
    </label>

    <label class="setting">
      <input
        id="tolls"
        type="checkbox"
        checked>
      Avoid tolls
    </label>

    <label class="setting">
      <input
        id="restricted"
        type="checkbox"
        checked>
      Avoid restricted
    </label>

    <label class="setting">
      <input
        id="lowSpeed"
        type="checkbox"
        checked>
      Prefer lower-speed roads
    </label>

    <label class="setting">
      <input
        id="unpaved"
        type="checkbox"
        checked>
      Avoid unpaved
    </label>

    <label class="setting">
      <input
        id="live"
        type="checkbox"
        checked>
      Live GPS
    </label>

  </div>


  <div class="status">

    <span>
      Vehicle:
      <b id="vehicleName">
        50cc Scooter
      </b>
    </span>

    <span id="gps">
      GPS waiting…
    </span>

  </div>

</div>


<!-- BOTTOM CARD -->

<div class="bottom">

  <div class="routeLine">

    <div>

      <div
        class="routeTitle"
        id="routeTitle">
        Choose a destination
      </div>

      <div
        class="routeMeta"
        id="routeMeta">
        SmallRoute vehicle-aware routing
      </div>

    </div>


    <button
      class="primary"
      id="navBtn">
      Navigate
    </button>

  </div>


  <div class="actions">

    <button
      class="report"
      id="reportBtn">
      ⚠ Report
    </button>

    <button
      class="locate"
      id="locateBtn">
      ◎ My location
    </button>

  </div>


  <div class="notice">

    v0.3 uses vehicle-specific routing profiles.
    Road suitability is a routing aid, not a legal determination.

  </div>

</div>


<div id="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
  zoomControl: false
}).setView(
  [25.94, -80.21],
  12
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  }
).addTo(map);


L.control.zoom({
  position: "bottomright"
}).addTo(map);


/* =========================================================
   GLOBAL STATE
========================================================= */

let userMarker = null;

let destinationMarker = null;

let routeLayer = null;

let userPos = null;

let destination = null;

let watchId = null;


/* =========================================================
   VEHICLE PROFILES
========================================================= */

const profiles = {

  "50": {

    name: "50cc Scooter",

    costing: "motor_scooter",

    topSpeed: 50

  },

  "150": {

    name: "150cc Scooter",

    costing: "motor_scooter",

    topSpeed: 85

  },

  "moto": {

    name: "Motorcycle",

    costing: "motorcycle",

    topSpeed: 120

  },

  "bicycle": {

    name: "Motorized bicycle",

    costing: "bicycle",

    topSpeed: 35

  }

};


let selected =
  localStorage.getItem(
    "smallrouteVehicle"
  ) || "50";


/* =========================================================
   TOAST
========================================================= */

function toast(message) {

  const t =
    document.getElementById("toast");

  t.textContent = message;

  t.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {

      t.style.display = "none";

    }, 2600);
}


/* =========================================================
   CURRENT PROFILE
========================================================= */

function profile() {

  return profiles[selected];

}


/* =========================================================
   VEHICLE SELECTION
========================================================= */

function setVehicle(vehicle) {

  selected = vehicle;


  document
    .querySelectorAll(".chip")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.v === vehicle
      );

    });


  document.getElementById(
    "vehicleName"
  ).textContent =
    profile().name;


  localStorage.setItem(
    "smallrouteVehicle",
    vehicle
  );


  if (
    destination &&
    userPos
  ) {

    route();

  }

}


document
  .querySelectorAll(".chip")
  .forEach(button => {

    button.onclick = () => {

      setVehicle(
        button.dataset.v
      );

    };

  });


setVehicle(selected);


/* =========================================================
   GPS
========================================================= */

function locate() {

  if (!navigator.geolocation) {

    toast(
      "GPS is not available"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      userPos = {

        lat:
          position.coords.latitude,

        lon:
          position.coords.longitude,

        accuracy:
          position.coords.accuracy

      };


      if (!userMarker) {

        userMarker =
          L.marker([
            userPos.lat,
            userPos.lon
          ])
          .addTo(map)
          .bindPopup(
            "You are here"
          );

      } else {

        userMarker.setLatLng([
          userPos.lat,
          userPos.lon
        ]);

      }


      map.setView(
        [
          userPos.lat,
          userPos.lon
        ],
        14
      );


      document.getElementById(
        "gps"
      ).textContent =
        `GPS ±${Math.round(
          userPos.accuracy
        )}m`;


      if (destination) {

        route();

      }

    },

    error => {

      toast(
        "GPS error: " +
        error.message
      );

    },

    {
      enableHighAccuracy: true,

      maximumAge: 10000,

      timeout: 15000

    }

  );

}


/* =========================================================
   LIVE GPS
========================================================= */

function startWatch() {

  if (
    watchId !== null
  ) {

    navigator.geolocation
      .clearWatch(
        watchId
      );

  }


  if (
    !document.getElementById(
      "live"
    ).checked
  ) {

    return;

  }


  if (
    !navigator.geolocation
  ) {

    return;

  }


  watchId =
    navigator.geolocation.watchPosition(

      position => {

        userPos = {

          lat:
            position.coords.latitude,

          lon:
            position.coords.longitude,

          accuracy:
            position.coords.accuracy

        };


        if (!userMarker) {

          userMarker =
            L.marker([
              userPos.lat,
              userPos.lon
            ])
            .addTo(map);

        } else {

          userMarker.setLatLng([
            userPos.lat,
            userPos.lon
          ]);

        }


        document.getElementById(
          "gps"
        ).textContent =
          `GPS ±${Math.round(
            userPos.accuracy
          )}m`;

      },

      () => {},

      {

        enableHighAccuracy: true,

        maximumAge: 5000,

        timeout: 10000

      }

    );

}


document.getElementById(
  "live"
).onchange = startWatch;


/* =========================================================
   DESTINATION SEARCH
========================================================= */

async function geocode(query) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2" +
    "&limit=1" +
    "&countrycodes=us" +
    "&q=" +
    encodeURIComponent(query);


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Search failed"
    );

  }


  const results =
    await response.json();


  if (!results.length) {

    throw new Error(
      "Destination not found"
    );

  }


  return {

    lat:
      Number(results[0].lat),

    lon:
      Number(results[0].lon),

    name:
      results[0].display_name

  };

}


/* =========================================================
   VALHALLA POLYLINE DECODER
========================================================= */

function decode6(encoded) {

  let index = 0;

  let latitude = 0;

  let longitude = 0;

  const coordinates = [];


  while (
    index < encoded.length
  ) {

    let result = 0;

    let shift = 0;

    let byte;


    do {

      byte =
        encoded.charCodeAt(
          index++
        ) - 63;

      result |=
        (byte & 31) << shift;

      shift += 5;

    } while (
      byte >= 32
    );


    const deltaLatitude =
      (result & 1)
        ? ~(result >> 1)
        : (result >> 1);


    latitude +=
      deltaLatitude;


    result = 0;

    shift = 0;


    do {

      byte =
        encoded.charCodeAt(
          index++
        ) - 63;

      result |=
        (byte & 31) << shift;

      shift += 5;

    } while (
      byte >= 32
    );


    const deltaLongitude =
      (result & 1)
        ? ~(result >> 1)
        : (result >> 1);


    longitude +=
      deltaLongitude;


    coordinates.push([

      latitude / 1e6,

      longitude / 1e6

    ]);

  }


  return coordinates;

}


/* =========================================================
   VEHICLE-AWARE ROUTING
========================================================= */

async function route() {

  if (!userPos) {

    locate();

    toast(
      "Getting your GPS position…"
    );

    return;

  }


  if (!destination) {

    return;

  }


  const p = profile();


  const payload = {

    locations: [

      {

        lat:
          userPos.lat,

        lon:
          userPos.lon

      },

      {

        lat:
          destination.lat,

        lon:
          destination.lon

      }

    ],

    costing:
      p.costing,

    units:
      "miles",

    costing_options: {}

  };


  /* -----------------------------------------
     50cc / 150cc SCOOTER
  ----------------------------------------- */

  if (
    p.costing ===
    "motor_scooter"
  ) {

    payload
      .costing_options
      .motor_scooter = {

        top_speed:
          p.topSpeed,

        use_highways:
          document.getElementById(
            "highways"
          ).checked
            ? 0
            : 1,

        use_tolls:
          document.getElementById(
            "tolls"
          ).checked
            ? 0
            : 1,

        use_primary:
          document.getElementById(
            "lowSpeed"
          ).checked
            ? 0.35
            : 1

      };

  }


  /* -----------------------------------------
     MOTORCYCLE
  ----------------------------------------- */

  if (
    p.costing ===
    "motorcycle"
  ) {

    payload
      .costing_options
      .motorcycle = {

        use_highways:
          document.getElementById(
            "highways"
          ).checked
            ? 0
            : 1,

        use_tolls:
          document.getElementById(
            "tolls"
          ).checked
            ? 0
            : 1

      };

  }


  /* -----------------------------------------
     MOTORIZED BICYCLE
  ----------------------------------------- */

  if (
    p.costing ===
    "bicycle"
  ) {

    payload
      .costing_options
      .bicycle = {

        bicycle_type:
          "road",

        use_roads:
          0.75

      };

  }


  document.getElementById(
    "routeTitle"
  ).textContent =
    "Calculating vehicle-aware route…";


  try {

    const url =
      "https://valhalla.openstreetmap.de/route?json=" +
      encodeURIComponent(
        JSON.stringify(payload)
      );


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Routing service returned " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.trip ||
      !data.trip.legs ||
      !data.trip.legs.length
    ) {

      throw new Error(
        "No route found"
      );

    }


    const leg =
      data.trip.legs[0];


    const points =
      decode6(
        leg.shape
      );


    if (routeLayer) {

      map.removeLayer(
        routeLayer
      );

    }


    routeLayer =
      L.polyline(
        points,
        {

          weight: 6,

          opacity: 0.9

        }
      ).addTo(map);


    map.fitBounds(
      routeLayer.getBounds(),
      {

        padding: [
          40,
          250
        ]

      }
    );


    const summary =
      data.trip.summary || {};


    const miles =
      (
        summary.length || 0
      ).toFixed(1);


    const minutes =
      Math.round(
        (
          summary.time || 0
        ) / 60
      );


    document.getElementById(
      "routeTitle"
    ).textContent =
      `${miles} mi • ${minutes} min`;


    document.getElementById(
      "routeMeta"
    ).textContent =
      `${p.name} • highways ${
        document.getElementById(
          "highways"
        ).checked
          ? "avoided"
          : "allowed"
      } • tolls ${
        document.getElementById(
          "tolls"
        ).checked
          ? "avoided"
          : "allowed"
      }`;

  }

  catch (error) {

    console.error(
      error
    );


    document.getElementById(
      "routeTitle"
    ).textContent =
      "Route unavailable";


    document.getElementById(
      "routeMeta"
    ).textContent =
      error.message;


    toast(
      "Routing service unavailable. Try again."
    );

  }

}


/* =========================================================
   SEARCH BUTTON
========================================================= */

document.getElementById(
  "searchBtn"
).onclick =
  async function () {

    const query =
      document.getElementById(
        "dest"
      ).value.trim();


    if (!query) {

      return;

    }


    try {

      document.getElementById(
        "routeTitle"
      ).textContent =
        "Finding destination…";


      destination =
        await geocode(
          query
        );


      if (
        destinationMarker
      ) {

        map.removeLayer(
          destinationMarker
        );

      }


      destinationMarker =
        L.marker([

          destination.lat,

          destination.lon

        ])
        .addTo(map)
        .bindPopup(
          destination.name
        )
        .openPopup();


      await route();

    }

    catch (error) {

      toast(
        error.message
      );

    }

  };


/* =========================================================
   ENTER KEY
========================================================= */

document.getElementById(
  "dest"
).addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      document.getElementById(
        "searchBtn"
      ).click();

    }

  }
);


/* =========================================================
   LOCATION BUTTON
========================================================= */

document.getElementById(
  "locateBtn"
).onclick =
  locate;


/* =========================================================
   NAVIGATION BUTTON
========================================================= */

document.getElementById(
  "navBtn"
).onclick =
  function () {

    if (!destination) {

      toast(
        "Search for a destination first"
      );

      return;

    }


    startWatch();


    toast(
      "Navigation mode started"
    );

  };


/* =========================================================
   REPORT BUTTON
========================================================= */

document.getElementById(
  "reportBtn"
).onclick =
  function () {

    toast(
      "Reports are the next module."
    );

  };


/* =========================================================
   ROUTING SETTINGS
========================================================= */

[
  "highways",
  "tolls",
  "restricted",
  "lowSpeed",
  "unpaved"

].forEach(id => {

  document.getElementById(
    id
  ).onchange =
    function () {

      if (
        destination
      ) {

        route();

      }

    };

});


/* =========================================================
   START
========================================================= */

locate();

startWatch();

</script>

</body>
</html>
