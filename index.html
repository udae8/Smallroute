<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#111827">

<title>SmallRoute v0.4</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{box-sizing:border-box}

html,body,#map{

  height:100%;

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

body{

  background:#111827;

  overflow:hidden;

}

#map{

  position:fixed;

  inset:0;

}

.panel{

  position:fixed;

  z-index:1000;

  left:12px;

  right:12px;

  top:12px;

  background:white;

  border-radius:18px;

  box-shadow:0 5px 25px #0003;

  padding:10px;

}

.search{

  display:flex;

  gap:8px;

}

.search input{

  flex:1;

  border:0;

  background:#f1f5f9;

  border-radius:12px;

  padding:13px;

  font-size:16px;

  outline:none;

}

.search button{

  border:0;

  border-radius:12px;

  padding:0 15px;

  font-weight:700;

  background:#111827;

  color:white;

}

.results{

  display:none;

  margin-top:8px;

  max-height:240px;

  overflow-y:auto;

  background:#f8fafc;

  border-radius:12px;

  border:1px solid #e2e8f0;

}

.result{

  display:block;

  width:100%;

  border:0;

  border-bottom:1px solid #e2e8f0;

  background:white;

  text-align:left;

  padding:12px;

}

.result:last-child{

  border-bottom:0;

}

.result-title{

  font-size:14px;

  font-weight:700;

}

.result-address{

  margin-top:3px;

  font-size:11px;

  color:#64748b;

}

.message{

  padding:13px;

  text-align:center;

  font-size:12px;

  color:#64748b;

}

.chips{

  display:flex;

  gap:7px;

  overflow-x:auto;

  padding:9px 0 2px;

}

.chip{

  white-space:nowrap;

  border:1px solid #d1d5db;

  background:white;

  border-radius:999px;

  padding:8px 11px;

  font-weight:650;

}

.chip.active{

  background:#111827;

  color:white;

  border-color:#111827;

}

.settings{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  margin-top:9px;

}

.setting{

  background:#f8fafc;

  border-radius:11px;

  padding:8px;

  font-size:12px;

  display:flex;

  align-items:center;

  gap:7px;

}

.setting input{

  accent-color:#111827;

}

.status{

  margin-top:8px;

  font-size:12px;

  color:#475569;

  display:flex;

  justify-content:space-between;

  gap:10px;

}

.status b{

  color:#111827;

}

.bottom{

  position:fixed;

  z-index:1000;

  left:12px;

  right:12px;

  bottom:12px;

  background:white;

  border-radius:18px;

  box-shadow:0 5px 25px #0003;

  padding:12px;

}

.route-line{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

}

.route-title{

  font-size:15px;

  font-weight:800;

}

.route-meta{

  font-size:12px;

  color:#64748b;

  margin-top:3px;

}

.primary{

  border:0;

  border-radius:12px;

  padding:12px 16px;

  font-weight:700;

  background:#111827;

  color:white;

}

.actions{

  display:flex;

  gap:8px;

  margin-top:9px;

}

.actions button{

  flex:1;

  border:0;

  border-radius:11px;

  padding:10px;

  font-weight:750;

}

.report{

  background:#fee2e2;

  color:#991b1b;

}

.locate{

  background:#e2e8f0;

}

.notice{

  font-size:11px;

  color:#64748b;

  margin-top:8px;

  line-height:1.35;

}

#toast{

  position:fixed;

  z-index:2000;

  left:50%;

  bottom:150px;

  transform:translateX(-50%);

  background:#111827;

  color:white;

  padding:10px 14px;

  border-radius:999px;

  font-size:13px;

  display:none;

  max-width:90%;

  text-align:center;

}

</style>

</head>

<body>

<div id="map"></div>

<div class="panel">

  <div class="search">

    <input id="dest" type="search" placeholder="Where to?">

    <button id="searchBtn">Go</button>

  </div>

  <div id="results" class="results"></div>

  <div class="chips">

    <button class="chip active" data-vehicle="50">50cc</button>

    <button class="chip" data-vehicle="150">150cc</button>

    <button class="chip" data-vehicle="motorcycle">Motorcycle</button>

    <button class="chip" data-vehicle="bicycle">Motorized bicycle</button>

  </div>

  <div class="settings">

    <label class="setting">

      <input id="avoidHighways" type="checkbox" checked>

      Avoid highways

    </label>

    <label class="setting">

      <input id="avoidTolls" type="checkbox" checked>

      Avoid tolls

    </label>

    <label class="setting">

      <input id="avoidRestricted" type="checkbox" checked>

      Avoid restricted

    </label>

    <label class="setting">

      <input id="lowSpeed" type="checkbox" checked>

      Prefer lower-speed roads

    </label>

    <label class="setting">

      <input id="avoidUnpaved" type="checkbox" checked>

      Avoid unpaved

    </label>

    <label class="setting">

      <input id="liveGps" type="checkbox" checked>

      Live GPS

    </label>

  </div>

  <div class="status">

    <span>

      Vehicle:

      <b id="vehicleName">50cc Scooter</b>

    </span>

    <span id="gpsStatus">

      GPS waiting…

    </span>

  </div>

</div>

<div class="bottom">

  <div class="route-line">

    <div>

      <div id="routeTitle" class="route-title">

        Choose a destination

      </div>

      <div id="routeMeta" class="route-meta">

        SmallRoute v0.4

      </div>

    </div>

    <button id="navigateBtn" class="primary">

      Navigate

    </button>

  </div>

  <div class="actions">

    <button id="reportBtn" class="report">

      ⚠ Report

    </button>

    <button id="locateBtn" class="locate">

      ◎ My location

    </button>

  </div>

  <div class="notice">

    Vehicle-aware navigation prototype. Road suitability is a routing aid, not a legal determination.

  </div>

</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([25.94,-80.21],12);

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    attribution:"© OpenStreetMap contributors"

  }

).addTo(map);

L.control.zoom({

  position:"bottomright"

}).addTo(map);

let userPosition = null;

let destination = null;

let userMarker = null;

let destinationMarker = null;

let routeLine = null;

let gpsWatch = null;

const vehicles = {

  "50":{

    name:"50cc Scooter",

    costing:"motor_scooter",

    topSpeed:50

  },

  "150":{

    name:"150cc Scooter",

    costing:"motor_scooter",

    topSpeed:85

  },

  "motorcycle":{

    name:"Motorcycle",

    costing:"motorcycle",

    topSpeed:120

  },

  "bicycle":{

    name:"Motorized bicycle",

    costing:"bicycle",

    topSpeed:35

  }

};

let selectedVehicle =

  localStorage.getItem("smallrouteVehicle") || "50";

function showToast(message){

  const toast =

    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =

    setTimeout(function(){

      toast.style.display = "none";

    },2600);

}

function updateVehicleButtons(){

  document

    .querySelectorAll(".chip")

    .forEach(function(button){

      button.classList.toggle(

        "active",

        button.dataset.vehicle === selectedVehicle

      );

    });

  document.getElementById("vehicleName").textContent =

    vehicles[selectedVehicle].name;

  localStorage.setItem(

    "smallrouteVehicle",

    selectedVehicle

  );

}

document

  .querySelectorAll(".chip")

  .forEach(function(button){

    button.addEventListener("click",function(){

      selectedVehicle =

        button.dataset.vehicle;

      updateVehicleButtons();

      if(destination && userPosition){

        calculateRoute();

      }

    });

  });

updateVehicleButtons();

function getLocation(){

  if(!navigator.geolocation){

    showToast("GPS is not available.");

    return;

  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      userPosition = {

        lat:position.coords.latitude,

        lon:position.coords.longitude,

        accuracy:position.coords.accuracy

      };

      updateUserMarker();

      map.setView(

        [

          userPosition.lat,

          userPosition.lon

        ],

        14

      );

      updateGpsText();

      if(destination){

        calculateRoute();

      }

    },

    function(error){

      showToast(

        "GPS error: " + error.message

      );

    },

    {

      enableHighAccuracy:true,

      maximumAge:10000,

      timeout:15000

    }

  );

}

function updateUserMarker(){

  if(!userPosition){

    return;

  }

  const point = [

    userPosition.lat,

    userPosition.lon

  ];

  if(!userMarker){

    userMarker =

      L.marker(point)

        .addTo(map)

        .bindPopup("You are here");

  }else{

    userMarker.setLatLng(point);

  }

}

function updateGpsText(){

  if(!userPosition){

    return;

  }

  document.getElementById("gpsStatus").textContent =

    "GPS ±" +

    Math.round(userPosition.accuracy) +

    "m";

}

function startGpsWatch(){

  if(gpsWatch !== null){

    navigator.geolocation.clearWatch(

      gpsWatch

    );

  }

  if(

    !document.getElementById("liveGps").checked

  ){

    return;

  }

  if(!navigator.geolocation){

    return;

  }

  gpsWatch =

    navigator.geolocation.watchPosition(

      function(position){

        userPosition = {

          lat:position.coords.latitude,

          lon:position.coords.longitude,

          accuracy:position.coords.accuracy

        };

        updateUserMarker();

        updateGpsText();

      },

      function(){},

      {

        enableHighAccuracy:true,

        maximumAge:5000,

        timeout:10000

      }

    );

}

document

  .getElementById("liveGps")

  .addEventListener(

    "change",

    startGpsWatch

  );

async function searchPlaces(query){

  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=jsonv2" +

    "&limit=8" +

    "&addressdetails=1" +

    "&countrycodes=us" +

    "&q=" +

    encodeURIComponent(query);

  const response =

    await fetch(url);

  if(!response.ok){

    throw new Error(

      "Search service unavailable."

    );

  }

  return await response.json();

}

function displaySearchResults(results){

  const container =

    document.getElementById("results");

  container.innerHTML = "";

  if(!results.length){

    container.innerHTML =

      '<div class="message">No destinations found.</div>';

    container.style.display = "block";

    return;

  }

  results.forEach(function(result){

    const button =

      document.createElement("button");

    button.className = "result";

    const title =

      document.createElement("div");

    title.className = "result-title";

    title.textContent =

      result.name ||

      result.display_name.split(",")[0];

    const address =

      document.createElement("div");

    address.className = "result-address";

    address.textContent =

      result.display_name;

    button.appendChild(title);

    button.appendChild(address);

    button.addEventListener(

      "click",

      function(){

        chooseDestination(result);

      }

    );

    container.appendChild(button);

  });

  container.style.display = "block";

}

async function search(){

  const input =

    document.getElementById("dest");

  const query =

    input.value.trim();

  if(!query){

    showToast(

      "Enter a destination first."

    );

    return;

  }

  const results =

    document.getElementById("results");

  results.style.display = "block";

  results.innerHTML =

    '<div class="message">Searching…</div>';

  try{

    const places =

      await searchPlaces(query);

    displaySearchResults(places);

  }catch(error){

    results.innerHTML =

      '<div class="message">Search failed. Try again.</div>';

    showToast(error.message);

  }

}

document

  .getElementById("searchBtn")

  .addEventListener(

    "click",

    search

  );

document

  .getElementById("dest")

  .addEventListener(

    "keydown",

    function(event){

      if(event.key === "Enter"){

        search();

      }

    }

  );

function chooseDestination(result){

  destination = {

    lat:Number(result.lat),

    lon:Number(result.lon),

    name:result.display_name

  };

  document.getElementById("dest").value =

    result.name ||

    result.display_name.split(",")[0];

  document.getElementById("results").style.display =

    "none";

  if(destinationMarker){

    map.removeLayer(

      destinationMarker

    );

  }

  destinationMarker =

    L.marker(

      [

        destination.lat,

        destination.lon

      ]

    )

    .addTo(map)

    .bindPopup(

      destination.name

    )

    .openPopup();

  document.getElementById("routeTitle").textContent =

    "Calculating route…";

  calculateRoute();

}

function decodePolyline(encoded){

  let index = 0;

  let lat = 0;

  let lon = 0;

  const points = [];

  while(index < encoded.length){

    let result = 0;

    let shift = 0;

    let byte;

    do{

      byte =

        encoded.charCodeAt(index++) - 63;

      result |=

        (byte & 31) << shift;

      shift += 5;

    }while(byte >= 32);

    lat +=

      (result & 1)

      ? ~(result >> 1)

      : (result >> 1);

    result = 0;

    shift = 0;

    do{

      byte =

        encoded.charCodeAt(index++) - 63;

      result |=

        (byte & 31) << shift;

      shift += 5;

    }while(byte >= 32);

    lon +=

      (result & 1)

      ? ~(result >> 1)

      : (result >> 1);

    points.push([

      lat / 1000000,

      lon / 1000000

    ]);

  }

  return points;

}

async function calculateRoute(){

  if(!userPosition){

    getLocation();

    showToast(

      "Getting your GPS location…"

    );

    return;

  }

  if(!destination){

    return;

  }

  const vehicle =

    vehicles[selectedVehicle];

  const payload = {

    locations:[

      {

        lat:userPosition.lat,

        lon:userPosition.lon

      },

      {

        lat:destination.lat,

        lon:destination.lon

      }

    ],

    costing:vehicle.costing,

    units:"miles",

    costing_options:{}

  };

  if(vehicle.costing === "motor_scooter"){

    payload.costing_options.motor_scooter = {

      top_speed:vehicle.topSpeed,

      use_highways:

        document.getElementById("avoidHighways").checked

        ? 0

        : 1,

      use_tolls:

        document.getElementById("avoidTolls").checked

        ? 0

        : 1,

      use_primary:

        document.getElementById("lowSpeed").checked

        ? 0.35

        : 1

    };

  }

  if(vehicle.costing === "motorcycle"){

    payload.costing_options.motorcycle = {

      use_highways:

        document.getElementById("avoidHighways").checked

        ? 0

        : 1,

      use_tolls:

        document.getElementById("avoidTolls").checked

        ? 0

        : 1

    };

  }

  if(vehicle.costing === "bicycle"){

    payload.costing_options.bicycle = {

      bicycle_type:"road",

      use_roads:0.75

    };

  }

  document.getElementById("routeTitle").textContent =

    "Calculating route…";

  try{

    const url =

      "https://valhalla.openstreetmap.de/route?json=" +

      encodeURIComponent(

        JSON.stringify(payload)

      );

    const response =

      await fetch(url);

    if(!response.ok){

      throw new Error(

        "Routing service returned " +

        response.status

      );

    }

    const data =

      await response.json();

    if(

      !data.trip ||

      !data.trip.legs ||

      !data.trip.legs.length

    ){

      throw new Error(

        "No route found."

      );

    }

    const points =

      decodePolyline(

        data.trip.legs[0].shape

      );

    if(routeLine){

      map.removeLayer(

        routeLine

      );

    }

    routeLine =

      L.polyline(

        points,

        {

          weight:6,

          opacity:0.9

        }

      ).addTo(map);

    map.fitBounds(

      routeLine.getBounds(),

      {

        padding:[

          40,

          250

        ]

      }

    );

    const summary =

      data.trip.summary || {};

    const miles =

      Number(

        summary.length || 0

      ).toFixed(1);

    const minutes =

      Math.round(

        Number(

          summary.time || 0

        ) / 60

      );

    document.getElementById("routeTitle").textContent =

      miles +

      " mi • " +

      minutes +

      " min";

    document.getElementById("routeMeta").textContent =

      vehicle.name +

      " • highways " +

      (

        document.getElementById("avoidHighways").checked

        ? "avoided"

        : "allowed"

      ) +

      " • tolls " +

      (

        document.getElementById("avoidTolls").checked

        ? "avoided"

        : "allowed"

      );

  }catch(error){

    console.error(error);

    document.getElementById("routeTitle").textContent =

      "Route unavailable";

    document.getElementById("routeMeta").textContent =

      error.message;

    showToast(

      "Routing service unavailable."

    );

  }

}

[

  "avoidHighways",

  "avoidTolls",

  "avoidRestricted",

  "lowSpeed",

  "avoidUnpaved"

].forEach(function(id){

  document

    .getElementById(id)

    .addEventListener(

      "change",

      function(){

        if(destination){

          calculateRoute();

        }

      }

    );

});

document

  .getElementById("locateBtn")

  .addEventListener(

    "click",

    getLocation

  );

document

  .getElementById("navigateBtn")

  .addEventListener(

    "click",

    function(){

      if(!destination){

        showToast(

          "Choose a destination first."

        );

        return;

      }

      startGpsWatch();

      showToast(

        "Navigation mode started."

      );

    }

  );

document

  .getElementById("reportBtn")

  .addEventListener(

    "click",

    function(){

      showToast(

        "Reports will be added in the next module."

      );

    }

  );

map.on(

  "click",

  function(){

    document.getElementById("results").style.display =

      "none";

  }

);

getLocation();

startGpsWatch();

</script>

</body>

</html>
