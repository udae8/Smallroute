<!doctype html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SmallRoute v0.5</title>

<link

  rel="stylesheet"

  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

/>

<style>

* {

  box-sizing: border-box;

}

html,

body {

  margin: 0;

  padding: 0;

  width: 100%;

  height: 100%;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  background: #111;

  color: #fff;

}

#app {

  width: 100%;

  height: 100%;

  position: relative;

  overflow: hidden;

}

#map {

  position: absolute;

  inset: 0;

  z-index: 1;

}

.topbar {

  position: absolute;

  top: env(safe-area-inset-top, 10px);

  left: 10px;

  right: 10px;

  z-index: 1000;

  padding-top: 8px;

}

.brand {

  background: rgba(15,15,15,.92);

  border-radius: 16px;

  padding: 10px 14px;

  box-shadow: 0 3px 15px rgba(0,0,0,.35);

}

.brand-title {

  font-size: 21px;

  font-weight: 800;

}

.brand-sub {

  font-size: 12px;

  opacity: .65;

  margin-top: 2px;

}

.search-area {

  margin-top: 8px;

  background: rgba(15,15,15,.94);

  border-radius: 16px;

  padding: 9px;

  box-shadow: 0 3px 15px rgba(0,0,0,.35);

}

.search-row {

  display: flex;

  gap: 7px;

}

#destinationInput {

  flex: 1;

  min-width: 0;

  border: 0;

  border-radius: 11px;

  padding: 13px;

  font-size: 16px;

  outline: none;

  background: #292929;

  color: white;

}

button {

  border: 0;

  border-radius: 11px;

  padding: 11px 14px;

  font-weight: 700;

  cursor: pointer;

}

#searchButton {

  background: #fff;

  color: #111;

}

#searchResults {

  display: none;

  margin-top: 8px;

  max-height: 230px;

  overflow-y: auto;

}

.search-result {

  padding: 12px;

  margin-top: 5px;

  border-radius: 10px;

  background: #242424;

}

.search-result:active {

  background: #3b3b3b;

}

.result-name {

  font-weight: 700;

  font-size: 14px;

}

.result-address {

  font-size: 12px;

  opacity: .65;

  margin-top: 3px;

}

.controls {

  position: absolute;

  right: 10px;

  top: 190px;

  z-index: 900;

  display: flex;

  flex-direction: column;

  gap: 7px;

}

.control-button {

  width: 47px;

  height: 47px;

  padding: 0;

  border-radius: 50%;

  background: rgba(15,15,15,.92);

  color: white;

  box-shadow: 0 3px 12px rgba(0,0,0,.35);

  font-size: 20px;

}

.panel {

  position: absolute;

  left: 10px;

  right: 10px;

  bottom: 10px;

  z-index: 1000;

  max-height: 48vh;

  overflow-y: auto;

  background: rgba(15,15,15,.95);

  border-radius: 20px;

  padding: 13px;

  box-shadow: 0 3px 20px rgba(0,0,0,.45);

}

.section-title {

  font-size: 13px;

  font-weight: 800;

  opacity: .65;

  text-transform: uppercase;

  letter-spacing: .5px;

  margin-bottom: 8px;

}

.vehicle-row {

  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 6px;

}

.vehicle {

  padding: 10px 4px;

  font-size: 11px;

  background: #292929;

  color: white;

  border-radius: 10px;

  text-align: center;

}

.vehicle.active {

  background: white;

  color: #111;

}

.vehicle-icon {

  font-size: 20px;

  display: block;

  margin-bottom: 3px;

}

.settings {

  margin-top: 12px;

}

.setting {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 8px 0;

  border-bottom: 1px solid rgba(255,255,255,.08);

  font-size: 14px;

}

.setting:last-child {

  border-bottom: 0;

}

.setting input {

  width: 20px;

  height: 20px;

}

.status {

  margin-top: 10px;

  padding: 9px;

  border-radius: 10px;

  background: #222;

  font-size: 12px;

}

.navigation {

  display: none;

  margin-top: 12px;

  background: #202020;

  border-radius: 14px;

  padding: 12px;

}

.nav-main {

  display: flex;

  align-items: center;

  gap: 12px;

}

.turn-arrow {

  font-size: 42px;

  width: 52px;

  text-align: center;

}

.nav-instruction {

  flex: 1;

}

.nav-distance {

  font-size: 24px;

  font-weight: 800;

}

.nav-text {

  font-size: 13px;

  opacity: .8;

  margin-top: 2px;

}

.trip-info {

  display: flex;

  justify-content: space-between;

  margin-top: 10px;

  padding-top: 9px;

  border-top: 1px solid rgba(255,255,255,.08);

}

.trip-value {

  font-size: 13px;

}

.trip-label {

  font-size: 10px;

  opacity: .55;

}

.maneuvers {

  margin-top: 10px;

}

.maneuver {

  display: flex;

  gap: 10px;

  padding: 9px 0;

  border-bottom: 1px solid rgba(255,255,255,.07);

}

.maneuver-arrow {

  width: 32px;

  font-size: 21px;

  text-align: center;

}

.maneuver-distance {

  font-size: 12px;

  opacity: .55;

  margin-top: 2px;

}

.action-row {

  display: flex;

  gap: 7px;

  margin-top: 11px;

}

.action-row button {

  flex: 1;

}

#navigateButton {

  background: white;

  color: #111;

}

#reportButton {

  background: #292929;

  color: white;

}

.toast {

  position: absolute;

  left: 50%;

  bottom: 55%;

  transform: translateX(-50%);

  z-index: 2000;

  background: rgba(0,0,0,.88);

  padding: 11px 15px;

  border-radius: 12px;

  font-size: 13px;

  display: none;

  max-width: 85%;

  text-align: center;

}

.gps-dot {

  width: 18px;

  height: 18px;

  background: #1683ff;

  border: 4px solid white;

  border-radius: 50%;

  box-shadow: 0 1px 7px rgba(0,0,0,.5);

}

.destination-dot {

  width: 18px;

  height: 18px;

  background: #ff3b30;

  border: 3px solid white;

  border-radius: 50%;

}

.leaflet-control-attribution {

  font-size: 8px;

}

@media (max-height: 700px) {

  .panel {

    max-height: 42vh;

  }

  .controls {

    top: 175px;

  }

}

</style>

</head>

<body>

<div id="app">

  <div id="map"></div>

  <div class="topbar">

    <div class="brand">

      <div class="brand-title">SmallRoute</div>

      <div class="brand-sub">Navigation for small vehicles</div>

    </div>

    <div class="search-area">

      <div class="search-row">

        <input

          id="destinationInput"

          type="search"

          placeholder="Where do you want to go?"

          autocomplete="off"

        >

        <button id="searchButton">Search</button>

      </div>

      <div id="searchResults"></div>

    </div>

  </div>

  <div class="controls">

    <button

      class="control-button"

      id="locateButton"

      title="My location"

    >📍</button>

    <button

      class="control-button"

      id="zoomInButton"

    >+</button>

    <button

      class="control-button"

      id="zoomOutButton"

    >−</button>

  </div>

  <div class="panel">

    <div class="section-title">Vehicle</div>

    <div class="vehicle-row">

      <button

        class="vehicle active"

        data-vehicle="50"

      >

        <span class="vehicle-icon">🛵</span>

        50cc

      </button>

      <button

        class="vehicle"

        data-vehicle="150"

      >

        <span class="vehicle-icon">🛵</span>

        150cc

      </button>

      <button

        class="vehicle"

        data-vehicle="motorcycle"

      >

        <span class="vehicle-icon">🏍️</span>

        Motorcycle

      </button>

      <button

        class="vehicle"

        data-vehicle="bicycle"

      >

        <span class="vehicle-icon">🚲</span>

        Motorized<br>Bicycle

      </button>

    </div>

    <div class="settings">

      <div class="section-title">Route preferences</div>

      <label class="setting">

        <span>Avoid highways / interstates</span>

        <input id="avoidHighways" type="checkbox" checked>

      </label>

      <label class="setting">

        <span>Avoid toll roads</span>

        <input id="avoidTolls" type="checkbox" checked>

      </label>

      <label class="setting">

        <span>Prefer lower-speed roads</span>

        <input id="lowSpeed" type="checkbox" checked>

      </label>

      <label class="setting">

        <span>Avoid unpaved roads</span>

        <input id="avoidUnpaved" type="checkbox" checked>

      </label>

      <label class="setting">

        <span>Live GPS tracking</span>

        <input id="liveGps" type="checkbox" checked>

      </label>

    </div>

    <div class="status" id="status">

      GPS: waiting for location…

    </div>

    <div class="navigation" id="navigation">

      <div class="nav-main">

        <div class="turn-arrow" id="turnArrow">

          ↑

        </div>

        <div class="nav-instruction">

          <div

            class="nav-distance"

            id="nextDistance"

          >

            —

          </div>

          <div

            class="nav-text"

            id="nextInstruction"

          >

            Route ready

          </div>

        </div>

      </div>

      <div class="trip-info">

        <div class="trip-value">

          <div id="remainingDistance">—</div>

          <div class="trip-label">REMAINING</div>

        </div>

        <div class="trip-value">

          <div id="eta">—</div>

          <div class="trip-label">ETA</div>

        </div>

        <div class="trip-value">

          <div id="routeTime">—</div>

          <div class="trip-label">TRIP TIME</div>

        </div>

      </div>

      <div

        class="maneuvers"

        id="maneuvers"

      ></div>

    </div>

    <div class="action-row">

      <button id="navigateButton">

        Start Navigation

      </button>

      <button id="reportButton">

        ⚠️ Report

      </button>

    </div>

  </div>

  <div class="toast" id="toast"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map", {

  zoomControl: false

}).setView([25.9420, -80.2450], 13);

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 19,

    attribution: "&copy; OpenStreetMap contributors"

  }

).addTo(map);

/* -------------------------

   STATE

------------------------- */

let currentPosition = null;

let gpsMarker = null;

let destinationMarker = null;

let routeLine = null;

let destination = null;

let selectedVehicle =

  localStorage.getItem("smallrouteVehicle") || "50";

let routeData = null;

let maneuvers = [];

let navigationActive = false;

let watchId = null;

let lastRouteTime = 0;

/* -------------------------

   VEHICLES

------------------------- */

const vehicleProfiles = {

  "50": {

    costing: "auto",

    topSpeed: 50,

    name: "50cc Scooter"

  },

  "150": {

    costing: "auto",

    topSpeed: 85,

    name: "150cc Scooter"

  },

  "motorcycle": {

    costing: "auto",

    topSpeed: 120,

    name: "Motorcycle"

  },

  "bicycle": {

    costing: "bicycle",

    topSpeed: 35,

    name: "Motorized Bicycle"

  }

};

/* -------------------------

   ELEMENTS

------------------------- */

const statusBox =

  document.getElementById("status");

const toast =

  document.getElementById("toast");

const searchResults =

  document.getElementById("searchResults");

const destinationInput =

  document.getElementById("destinationInput");

const navigation =

  document.getElementById("navigation");

/* -------------------------

   HELPERS

------------------------- */

function showToast(message, duration = 2500) {

  toast.textContent = message;

  toast.style.display = "block";

  setTimeout(() => {

    toast.style.display = "none";

  }, duration);

}

function formatDistance(miles) {

  if (!isFinite(miles)) {

    return "—";

  }

  if (miles < 0.1) {

    return Math.round(miles * 5280) + " ft";

  }

  return miles.toFixed(1) + " mi";

}

function formatMinutes(minutes) {

  if (!isFinite(minutes)) {

    return "—";

  }

  minutes = Math.round(minutes);

  if (minutes < 60) {

    return minutes + " min";

  }

  const hours =

    Math.floor(minutes / 60);

  const mins =

    minutes % 60;

  return hours + "h " + mins + "m";

}

function formatETA(seconds) {

  const now =

    new Date(Date.now() + seconds * 1000);

  return now.toLocaleTimeString([], {

    hour: "numeric",

    minute: "2-digit"

  });

}

/* -------------------------

   VEHICLE SELECTION

------------------------- */

document.querySelectorAll(".vehicle").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".vehicle")

      .forEach(v => v.classList.remove("active"));

    button.classList.add("active");

    selectedVehicle =

      button.dataset.vehicle;

    localStorage.setItem(

      "smallrouteVehicle",

      selectedVehicle

    );

    showToast(

      vehicleProfiles[selectedVehicle].name

    );

    if (destination && currentPosition) {

      calculateRoute();

    }

  });

});

document.querySelectorAll(".vehicle").forEach(button => {

  if (

    button.dataset.vehicle === selectedVehicle

  ) {

    button.classList.add("active");

  } else {

    button.classList.remove("active");

  }

});

/* -------------------------

   GPS

------------------------- */

function startGPS() {

  if (!navigator.geolocation) {

    statusBox.textContent =

      "GPS unavailable on this device.";

    return;

  }

  watchId =

    navigator.geolocation.watchPosition(

      position => {

        const lat =

          position.coords.latitude;

        const lon =

          position.coords.longitude;

        const accuracy =

          position.coords.accuracy;

        currentPosition = {

          lat,

          lon,

          accuracy

        };

        updateGPSMarker();

        statusBox.textContent =

          "GPS ±" +

          Math.round(accuracy) +

          "m";

        if (

          navigationActive &&

          destination

        ) {

          updateNavigationProgress();

        }

      },

      error => {

        statusBox.textContent =

          "GPS error: " + error.message;

      },

      {

        enableHighAccuracy: true,

        maximumAge: 2000,

        timeout: 15000

      }

    );

}

function updateGPSMarker() {

  if (!currentPosition) {

    return;

  }

  const lat =

    currentPosition.lat;

  const lon =

    currentPosition.lon;

  const icon =

    L.divIcon({

      className: "",

      html: '<div class="gps-dot"></div>',

      iconSize: [18,18],

      iconAnchor: [9,9]

    });

  if (!gpsMarker) {

    gpsMarker =

      L.marker([lat, lon], {

        icon,

        zIndexOffset: 1000

      }).addTo(map);

  } else {

    gpsMarker.setLatLng([lat, lon]);

  }

}

/* -------------------------

   SEARCH

------------------------- */

async function searchDestination() {

  const query =

    destinationInput.value.trim();

  if (!query) {

    return;

  }

  searchResults.style.display =

    "block";

  searchResults.innerHTML =

    "<div class='search-result'>Searching…</div>";

  try {

    const url =

      "https://nominatim.openstreetmap.org/search" +

      "?format=jsonv2" +

      "&limit=8" +

      "&addressdetails=1" +

      "&countrycodes=us" +

      "&q=" +

      encodeURIComponent(query);

    const response =

      await fetch(url, {

        headers: {

          "Accept": "application/json"

        }

      });

    if (!response.ok) {

      throw new Error("Search failed");

    }

    const results =

      await response.json();

    if (!results.length) {

      searchResults.innerHTML =

        "<div class='search-result'>No results found.</div>";

      return;

    }

    searchResults.innerHTML = "";

    results.forEach(result => {

      const item =

        document.createElement("div");

      item.className =

        "search-result";

      item.innerHTML = `

        <div class="result-name">

          ${escapeHtml(result.display_name.split(",")[0])}

        </div>

        <div class="result-address">

          ${escapeHtml(result.display_name)}

        </div>

      `;

      item.addEventListener("click", () => {

        selectDestination(result);

      });

      searchResults.appendChild(item);

    });

  } catch (error) {

    searchResults.innerHTML =

      "<div class='search-result'>Search unavailable.</div>";

  }

}

function escapeHtml(text) {

  return String(text)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}

function selectDestination(result) {

  destination = {

    lat: Number(result.lat),

    lon: Number(result.lon),

    name: result.display_name

  };

  searchResults.style.display =

    "none";

  destinationInput.value =

    result.display_name.split(",")[0];

  setDestinationMarker();

  map.setView(

    [destination.lat, destination.lon],

    14

  );

  if (currentPosition) {

    calculateRoute();

  } else {

    showToast(

      "Waiting for GPS location…"

    );

  }

}

function setDestinationMarker() {

  if (!destination) {

    return;

  }

  const icon =

    L.divIcon({

      className: "",

      html: '<div class="destination-dot"></div>',

      iconSize: [18,18],

      iconAnchor: [9,9]

    });

  if (!destinationMarker) {

    destinationMarker =

      L.marker(

        [destination.lat, destination.lon],

        { icon }

      ).addTo(map);

  } else {

    destinationMarker.setLatLng([

      destination.lat,

      destination.lon

    ]);

  }

}

/* -------------------------

   VALHALLA ROUTING

------------------------- */

async function calculateRoute() {
 

  if (!currentPosition || !destination) {

    showToast(

      "Need your GPS location and a destination."

    );

    return;

  }

  const now =

    Date.now();

  if (now - lastRouteTime < 1000) {

    return;

  }

  lastRouteTime = now;

  statusBox.textContent =

    "Calculating route…";

  const vehicle =

    vehicleProfiles[selectedVehicle];

  const useHighways =

    !document.getElementById(

      "avoidHighways"

    ).checked;

  const useTolls =

    !document.getElementById(

      "avoidTolls"

    ).checked;

  const preferLowSpeed =

    document.getElementById(

      "lowSpeed"

    ).checked;

  const avoidUnpaved =

    document.getElementById(

      "avoidUnpaved"

    ).checked;

  const payload = {

    locations: [

      {

        lat: currentPosition.lat,

        lon: currentPosition.lon,

        type: "break"

      },

      {

        lat: destination.lat,

        lon: destination.lon,

        type: "break"

      }

    ],

    costing:

      vehicle.costing,

    directions_options: {

      units: "miles",

      language: "en-US"

    },

    units: "miles",

    shape_format: "polyline6"

  };

  /*

    For now the public Valhalla server uses

    the normal auto/bicycle costing models.

    We use the vehicle profile to modify

    highway/road preferences where supported.

  */

  if (vehicle.costing === "auto") {

    payload.costing_options = {

      auto: {

        use_highways:

          useHighways ? 1 : 0,

        use_tolls:

          useTolls ? 1 : 0,

        top_speed:

          vehicle.topSpeed,

        use_primary:

          preferLowSpeed ? 0.5 : 1.0,

        use_tracks:

          avoidUnpaved ? 0 : 1

      }

    };

  }

  if (vehicle.costing === "bicycle") {

    payload.costing_options = {

      bicycle: {

        bicycle_type: "road",

        use_roads:

          preferLowSpeed ? 0.3 : 0.7

      }

    };

  }

  try {

    /*

      Valhalla public HTTP API.

      The demo website and HTTP API are

      different hosts.

    */

    const endpoint =

      "https://valhalla1.openstreetmap.de/route";

    /*

      POST avoids creating an excessively long

      URL when the request gets more complicated.

    */

    const response =

      await fetch(endpoint, {

        method: "POST",

        headers: {

          "Content-Type": "application/json",

          "X-Client-Id": "smallroute-prototype"

        },

        body:

          JSON.stringify(payload)

      });

    if (!response.ok) {

      const text =

        await response.text();

      throw new Error(

        "Routing HTTP " +

        response.status +

        ": " +

        text

      );

    }

    const data =

      await response.json();

    if (

      !data.trip ||

      !data.trip.legs ||

      !data.trip.legs.length

    ) {

      throw new Error(

        "No route returned."

      );

    }

    routeData =

      data.trip;

    drawRoute();

    setupManeuvers();

    statusBox.textContent =

      "Route ready • " +

      formatDistance(

        data.trip.summary.length

      );

    navigation.style.display =

      "block";

    showToast(

      "Route calculated"

    );

  } catch (error) {

    console.error(

      "SmallRoute routing error:",

      error

    );

    statusBox.textContent =

      "Routing service unavailable.";

    showToast(

      "Could not calculate route. Try again.",

      3500

    );

}

}

/* -------------------------

   POLYLINE DECODER

------------------------- */

function decodePolyline6(str) {

  let index = 0;

  let lat = 0;

  let lon = 0;

  const coordinates = [];

  while (index < str.length) {

    let result = 0;

    let shift = 0;

    let byte;

    do {

      byte =

        str.charCodeAt(index++) - 63;

      result |=

        (byte & 0x1f) << shift;

      shift += 5;

    } while (byte >= 0x20);

    const deltaLat =

      (result & 1)

        ? ~(result >> 1)

        : (result >> 1);

    lat += deltaLat;

    result = 0;

    shift = 0;

    do {

      byte =

        str.charCodeAt(index++) - 63;

      result |=

        (byte & 0x1f) << shift;

      shift += 5;

    } while (byte >= 0x20);

    const deltaLon =

      (result & 1)

        ? ~(result >> 1)

        : (result >> 1);

    lon += deltaLon;

    coordinates.push([

      lat / 1000000,

      lon / 1000000

    ]);

  }

  return coordinates;

}

/* -------------------------

   DRAW ROUTE

------------------------- */

function drawRoute() {

  if (!routeData) {

    return;

  }

  if (routeLine) {

    map.removeLayer(routeLine);

  }

  const points = [];

  routeData.legs.forEach(leg => {

    if (leg.shape) {

      const decoded =

        decodePolyline6(

          leg.shape

        );

      decoded.forEach(point => {

        points.push(point);

      });

    }

  });

  if (!points.length) {

    showToast(

      "Route received but no map shape was returned."

    );

    return;

  }

  routeLine =

    L.polyline(

      points,

      {

        weight: 6,

        opacity: 0.85

      }

    ).addTo(map);

  const bounds =

    routeLine.getBounds();

  map.fitBounds(

    bounds,

    {

      padding: [80, 220]

    }

  );

}

/* -------------------------

   MANEUVERS

------------------------- */

function setupManeuvers() {

  maneuvers = [];

  routeData.legs.forEach(leg => {

    if (leg.maneuvers) {

      leg.maneuvers.forEach(

        maneuver => {

          maneuvers.push(

            maneuver

          );

        }

      );

    }

  });

  renderManeuvers();

}

function maneuverArrow(maneuver) {

  const type =

    Number(maneuver.type);

  /*

    Valhalla maneuver types are numeric.

    These are intentionally approximate

    visual indicators for the prototype.

  */

  if (

    [1, 2, 3, 4, 5, 6].includes(type)

  ) {

    return "↰";

  }

  if (

    [7, 8, 9, 10].includes(type)

  ) {

    return "↱";

  }

  if (

    [11, 12].includes(type)

  ) {

    return "↑";

  }

  if (

    [13, 14, 15].includes(type)

  ) {

    return "↻";

  }

  return "↑";

}

function getInstruction(maneuver) {

  return (

    maneuver.instruction ||

    maneuver.verbal_pre_transition_instruction ||

    maneuver.verbal_succinct_transition_instruction ||

    "Continue"

  );

}

function maneuverDistance(maneuver) {

  if (

    maneuver.length !== undefined

  ) {

    return formatDistance(

      Number(maneuver.length)

    );

  }

  return "";

}

function renderManeuvers() {

  const container =

    document.getElementById(

      "maneuvers"

    );

  container.innerHTML = "";

  if (!maneuvers.length) {

    container.innerHTML =

      "<div class='maneuver'>No turn instructions returned.</div>";

    return;

  }

  maneuvers.forEach(

    (maneuver, index) => {

      const row =

        document.createElement("div");

      row.className =

        "maneuver";

      row.innerHTML = `

        <div class="maneuver-arrow">

          ${maneuverArrow(maneuver)}

        </div>

        <div>

          <div>

            ${escapeHtml(

              getInstruction(maneuver)

            )}

          </div>

          <div class="maneuver-distance">

            ${maneuverDistance(maneuver)}

          </div>

        </div>

      `;

      container.appendChild(row);

    }

  );

  updateNextManeuver();

}

/* -------------------------

   NAVIGATION

------------------------- */

function startNavigation() {

  if (!routeData) {

    showToast(

      "Search for a destination first."

    );

    return;

  }

  navigationActive =

    true;

  navigation.style.display =

    "block";

  document.getElementById(

    "navigateButton"

  ).textContent =

    "Navigation Active";

  updateNavigationProgress();

  showToast(

    "Navigation started"

  );

}

function updateNavigationProgress() {

  if (

    !navigationActive ||

    !currentPosition ||

    !maneuvers.length

  ) {

    return;

  }

  updateNextManeuver();

}

function updateNextManeuver() {

  if (!maneuvers.length) {

    return;

  }

  /*

    Prototype behavior:

    Use the first maneuver that has not

    been passed based on the route's

    begin/end shape indexes when available.

  */

  let currentIndex = 0;

  if (

    currentPosition &&

    routeLine

  ) {

    let nearest =

      routeLine.closestLayerPoint

      ? null

      : null;

    /*

      For v0.5 we keep maneuver selection

      simple and stable.

      Later we will match GPS position

      against the route geometry and

      automatically advance maneuvers.

    */

  }

  const maneuver =

    maneuvers[currentIndex];

  const instruction =

    getInstruction(maneuver);

  document.getElementById(

    "nextInstruction"

  ).textContent =

    instruction;

  document.getElementById(

    "turnArrow"

  ).textContent =

    maneuverArrow(maneuver);

  document.getElementById(

    "nextDistance"

  ).textContent =

    maneuverDistance(maneuver);

  if (routeData.summary) {

    document.getElementById(

      "remainingDistance"

    ).textContent =

      formatDistance(

        routeData.summary.length

      );

    document.getElementById(

      "routeTime"

    ).textContent =

      formatMinutes(

        routeData.summary.time / 60

      );

    document.getElementById(

      "eta"

    ).textContent =

      formatETA(

        routeData.summary.time

      );

  }

}

   BUTTONS

------------------------- */

document.getElementById(

  "searchButton"

).addEventListener(

  "click",

  searchDestination

);

destinationInput.addEventListener(

  "keydown",

  event => {

    if (event.key === "Enter") {

      searchDestination();

    }

  }

);

document.getElementById(

  "locateButton"

).addEventListener(

  "click",

  () => {

    if (!currentPosition) {

      showToast(

        "Waiting for GPS…"

      );

      return;

    }

    map.setView(

      [

        currentPosition.lat,

        currentPosition.lon

      ],

      16

    );

  }

);

document.getElementById(

  "zoomInButton"

).addEventListener(

  "click",

  () => map.zoomIn()

);

document.getElementById(

  "zoomOutButton"

).addEventListener(

  "click",

  () => map.zoomOut()

);

document.getElementById(

  "navigateButton"

).addEventListener(

  "click",

  startNavigation

);

document.getElementById(

  "reportButton"

).addEventListener(

  "click",

  () => {

    showToast(

      "Reporting system coming next."

    );

  }

);

/* -------------------------

   ROUTE SETTING CHANGES

------------------------- */

[

  "avoidHighways",

  "avoidTolls",

  "lowSpeed",

  "avoidUnpaved"

].forEach(id => {

  document.getElementById(id)

    .addEventListener(

      "change",

      () => {

        if (

          destination &&

          currentPosition

        ) {

          calculateRoute();

        }

      }

    );

});

/* -------------------------

   START

------------------------- */

startGPS();

showToast(

  "SmallRoute v0.5 ready",

  1800

);

</script>
